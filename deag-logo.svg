<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Drop Everything And Go" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112038"/><stop offset="1" stop-color="#0B1728"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="36" fill="url(#bg)"/>


  <g stroke="#0EBFB8" stroke-width="5" stroke-linecap="round" opacity=".85"><path d="M22 128 H46"/><path d="M22 150 H62" opacity=".6"/><path d="M22 106 H34" opacity=".5"/></g>
  <g transform="translate(24,10)">
    <!-- far wing -->
    <path d="M295 150 L410 150 L300 238 L246 238 Z" fill="#B8C8DC"/>
    <!-- tail fin -->
    <path d="M72 100 L54 34 L102 34 L178 100 Z" fill="#0EBFB8"/>
    <!-- fuselage -->
    <path d="M58 96 L470 96 C545 96 584 118 584 132 C584 146 545 168 470 168 L122 168 C92 168 70 148 58 96 Z" fill="#F6EEE0"/>
    <!-- gold belly stripe -->
    <path d="M100 160 L476 160 C530 160 565 150 580 140 C560 160 530 168 470 168 L122 168 C112 168 104 165 100 160 Z" fill="#E09420"/>
    <!-- cockpit -->
    <path d="M520 112 L546 112 C556 116 562 122 564 128 L512 128 Z" fill="#0B1728"/>
    <!-- windows -->
    <g fill="#0B1728" opacity=".75">
      <circle cx="440" cy="118" r="5"/><circle cx="462" cy="118" r="5"/><circle cx="484" cy="118" r="5"/>
    </g>
    <!-- engine -->
    <rect x="318" y="182" width="66" height="28" rx="14" fill="#E09420"/>
    <rect x="318" y="182" width="15" height="28" rx="7" fill="#B87418"/>
    <!-- near wing -->

    <!-- DEAG lettering (drawn as paths so it never depends on a font) -->
    <g fill="none" stroke="#0B1728" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="translate(150,98) scale(.98)">
      <!-- D -->
      <path d="M8 6 V50 H20 C34 50 40 40 40 28 C40 16 34 6 20 6 Z"/>
      <!-- E -->
      <g transform="translate(58,0)"><path d="M38 6 H8 V50 H38 M8 28 H32"/></g>
      <!-- A -->
      <g transform="translate(112,0)"><path d="M6 50 L24 6 L42 50 M13 34 H35"/></g>
      <!-- G -->
      <g transform="translate(172,0)"><path d="M40 15 C36 9 31 6 24 6 C14 6 8 14 8 28 C8 42 14 50 24 50 C34 50 40 44 40 32 H27"/></g>
    </g>
  </g>

  <text x="320" y="296" text-anchor="middle" font-family="Syne, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="6" fill="#F6EEE0" opacity=".85">DROP EVERYTHING AND GO</text>
</svg>
